# what the collector searches, read when each run starts: a change here, synced by argo cd,
# applies from the next run. every value is checked first, a bad one fails that run with the reason in its log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-collector
  namespace: backend
data:
  # origin-destination pairs, city codes cover all their airports (SEL is ICN and GMP, TYO is NRT and HND)
  ROUTES: "SEL-TYO,SEL-OSA"
  # what to search is each base date plus each of DAYS_AHEAD (0 is the base itself, empty is 0).
  # the base dates are DEPART_DATES (YYYY-MM-DD,...), or the day of each run (KST) when it's empty
  DEPART_DATES: ""
  DAYS_AHEAD: "1,7"
  # round-trip or one-way, and for a round trip the nights between departure and return
  TRIP: "round-trip"
  STAY_NIGHTS: "3"
  SEAT: "economy"
  ADULTS: "1"
  # empty for any number of stops, 0 for nonstop only
  MAX_STOPS: ""
  CURRENCY: "KRW"
  # a browser search is heavy on Google, so it waits long:
  # up to 30 minutes before the first search, and 1 to 3 minutes between searches
  START_JITTER_MAX_SECONDS: "1800"
  REQUEST_DELAY_MIN_SECONDS: "60"
  REQUEST_DELAY_MAX_SECONDS: "180"
  # failed or blocked searches in a row before the run stops, more requests only make a block last longer
  MAX_CONSECUTIVE_FAILURES: "3"
  # how long one search's page may take, its first results and the click on "View more flights" together
  PAGE_TIMEOUT_SECONDS: "60"
  # "true" searches and logs but writes nothing
  DRY_RUN: "false"
