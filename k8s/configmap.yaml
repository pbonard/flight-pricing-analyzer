# what the collector searches, read when each run starts: a change here, synced by argo cd,
# applies from the next run. every value is checked first, a bad one fails that run with the reason in its log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-collector
  namespace: backend
data:
  # origin-destination pairs, city codes cover all their airports (SEL is ICN and GMP, TYO is NRT and HND)
  ROUTES: "SEL-TYO"
  # the departure dates are BASE_DATE plus each of DAYS_AHEAD (0 is BASE_DATE itself, empty is 0).
  # BASE_DATE is one date (YYYY-MM-DD), or empty for the day of each run (KST). once a BASE_DATE has passed,
  # every run ends at once without searching: set a new one or suspend the cronjob
  BASE_DATE: ""
  # each run does one search, the one after the search the run before saved, then over again:
  # +1 -> +7 -> +14 -> +30 -> +60 -> +1 ... with more routes, each date's routes take turns: TYO+1 -> OSA+1 -> TYO+7.
  # how often is the cronjob's schedule alone (k8s/cronjob.yaml)
  DAYS_AHEAD: "1,7,14,30,60"
  # round-trip or one-way, and for a round trip the nights between departure and return
  TRIP: "round-trip"
  STAY_NIGHTS: "3"
  SEAT: "economy"
  ADULTS: "1"
  # empty for any number of stops, 0 for nonstop only
  MAX_STOPS: ""
  CURRENCY: "KRW"
  # a random wait before the search, so it doesn't come at the same minute every time
  START_JITTER_MAX_SECONDS: "1800"
  # "true" searches and logs but writes nothing
  DRY_RUN: "false"
