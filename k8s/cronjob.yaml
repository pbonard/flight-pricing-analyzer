# every 4 hours KST the collector opens the searches of the flight-collector configmap (k8s/configmap.yaml) in
# headless chromium and writes the whole result list to the cloudnative-pg cluster of my-infra
# k8s/bootstrap/postgres-cluster.yaml.
# every 4 hours, not 2: a browser search is heavier on Google, and searching too often gets the ip throttled.
# the jitter is in the collector, the schedule stays on the hour so it's easy to read
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flight-collector
  namespace: backend
spec:
  schedule: "0 */4 * * *"
  timeZone: Asia/Seoul
  # a slow run is skipped over rather than run alongside, two runs at once is twice the traffic to Google
  concurrencyPolicy: Forbid
  # a run that couldn't start in time (node down) is skipped, the next one is at most 4 hours away
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # no retries: a failed run is mostly a block, and retrying at once only makes it last
      backoffLimit: 0
      # well under the 4 hours, so a hung run never runs into the next
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: flight-collector
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr
          containers:
            - name: collector
              # the tag is written by .github/workflows/build.yml on every push to main
              image: ghcr.io/pbonard/flight-pricing-analyzer:f6af878
              # what to search, k8s/configmap.yaml
              envFrom:
                - configMapRef:
                    name: flight-collector
              env:
                # made by cloudnative-pg for the cluster's owner: postgresql://flights:...@postgres-rw.backend:5432/flights
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-app
                      key: uri
              resources:
                # chromium takes a few hundred MB while a page is open
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              volumeMounts:
                # chromium's profile, cache and shared memory (--disable-dev-shm-usage) are in /tmp
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
