# every 4 hours KST the collector does the next search of the flight-collector configmap's rotation (k8s/configmap.yaml),
# the one after the search the run before saved, writes it to the cloudnative-pg cluster of my-infra
# k8s/bootstrap/postgres-cluster.yaml and ends. the schedule alone is how often: "0 */6 * * *" is every 6 hours.
# once the configmap's BASE_DATE has passed every run ends at once, suspend it then.
# the jitter is in the collector, the schedule stays on the hour so it's easy to read
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flight-collector
  namespace: backend
spec:
  schedule: "0 */4 * * *"
  timeZone: Asia/Seoul
  # a slow run is skipped over rather than run alongside, two runs at once is twice the traffic to Google
  concurrencyPolicy: Forbid
  # a run that couldn't start in time (node down) is skipped, the next one is at most 4 hours away
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # no retries: a failed run is mostly a block, and retrying at once only makes it last
      backoffLimit: 0
      # well under the 4 hours, so a hung run never runs into the next
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: flight-collector
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr
          containers:
            - name: collector
              # which collector runs, two images of every build (.github/workflows/build.yml):
              #   ghcr.io/pbonard/fast-flight-collector  fast-flights, a plain request per search
              #   ghcr.io/pbonard/playwright-collector   a browser, the whole result list
              # change the name to switch, the tag is written by the build on every push to main
              image: ghcr.io/pbonard/playwright-collector:9dbdc9a
              # what to search, k8s/configmap.yaml
              envFrom:
                - configMapRef:
                    name: flight-collector
              env:
                # made by cloudnative-pg for the cluster's owner: postgresql://flights:...@postgres-rw.backend:5432/flights
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-app
                      key: uri
              resources:
                # fast-flights needs about 100Mi, playwright's chromium a few hundred while a page is open:
                # the limit fits either, so switching the image needs nothing else
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              volumeMounts:
                # the root filesystem is read only, temporary files go here
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
