name: build
on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/**
      - analysis/**
      - '*.md'
  # a pull request runs the tests only, its build and deploy wait for the merge
  pull_request:
    paths-ignore:
      - k8s/**
      - analysis/**
      - '*.md'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # the save tests write to a real postgres, the version of the cloudnative-pg cluster
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: checkout github
        uses: actions/checkout@v6

      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -r requirements.txt

      - name: test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    # only main is built and deployed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build and push
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" \
            --push .

      # argo cd deploys what k8s/ says, so the new tag goes into git. k8s/** is paths-ignored, this commit builds nothing
      - name: write the tag into the cronjob
        run: |
          sed -i -E "s#(image: ghcr.io/[^:]+):.*#\1:${GITHUB_SHA::7}#" k8s/cronjob.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: deploy ${GITHUB_SHA::7}" || exit 0
          git push
